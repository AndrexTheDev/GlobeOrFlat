# ----------------------------------------------------------------------------
# GlobeOrFlat API — Cloudflare Worker configuration
# SPDX-License-Identifier: MIT
# ----------------------------------------------------------------------------
#
# One-time provisioning:
#   npx wrangler d1 create globeorflat
#   npx wrangler r2 bucket create globeorflat-raw-sensor-dumps
#   -> paste the returned D1 database_id below.
#
# Apply the schema (local first, then remote):
#   npm run db:schema:local
#   npm run db:schema:remote
#
# Secrets (do NOT put these in this file):
#   npx wrangler secret put CLIENT_INGEST_TOKEN
#   npx wrangler secret put ADMIN_TOKEN
#
# Deploy:
#   npm run deploy
# ----------------------------------------------------------------------------

name = "globeorflat-api"
main = "worker.ts"
compatibility_date = "2026-09-01"

# ----------------------------------------------------------------------------
# Bindings
# ----------------------------------------------------------------------------

# D1 (SQLite) — metadata + append-only verification ledger.
[[d1_databases]]
binding = "DB"
database_name = "globeorflat"
# Replace after `wrangler d1 create globeorflat` (not required for local dev).
database_id = "00000000-0000-0000-0000-000000000000"

# R2 — raw sensor dumps (CSV), written once, never overwritten or deleted.
[[r2_buckets]]
binding = "RAW_DUMPS"
bucket_name = "globeorflat-raw-sensor-dumps"

# ----------------------------------------------------------------------------
# Non-secret configuration (overridable per environment)
# ----------------------------------------------------------------------------
[vars]
MAX_SENSOR_DUMP_BYTES = "5242880"     # 5 MiB max raw sensor dump per upload
MAX_PAYLOAD_BYTES = "65536"           # 64 KiB max signed JSON metadata part
PRESIGN_TTL_SECONDS = "3600"          # lifetime of presigned R2 download links
SIGNATURE_MAX_SKEW_MS = "300000"      # +/- 5 min anti-replay clock skew window
AUTO_VERIFY_SIGNED_UPLOADS = "false"  # if "true", signature-valid uploads enter the public feed immediately (moderators can still append REJECTED events)

# ----------------------------------------------------------------------------
# Workers rate limiting (platform binding).
# Global per-IP baseline for /api/v1/*: 300 requests / 60 s — far above any
# legitimate client or test-suite load, hard stop for naive floods.
# The worker fails OPEN if the binding errors (availability over strictness);
# volumetric DDoS at the edge remains Cloudflare's job.
#
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"

[unsafe.bindings.simple]
limit = 300
period = 60
# ----------------------------------------------------------------------------

[observability]
enabled = true
