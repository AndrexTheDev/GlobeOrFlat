# ============================================================================
# GlobeOrFlat — Android CI
# SPDX-License-Identifier: MIT
#
# What it does
#   1. flutter analyze + flutter test on every push/PR touching app/
#   2. release APK build, uploaded as a workflow artifact
#   3. on a version tag (v*) → attaches the APK to a GitHub Release —
#      this is the file the Open Science Hub "GET APK" button links to
#
# Notes
#   • `flutter create . --platforms android` runs before every build: this
#     repo authors the Android scaffolding by hand (manifest, MainActivity,
#     gradle files); create is idempotent and only adds MISSING files
#     (gradle-wrapper.jar, launcher icons, .metadata). Custom files survive.
#   • The release APK is debug-signed (installable); Play signing is a
#     documented follow-up in app/android/app/build.gradle.kts.
# ============================================================================

name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Idempotent scaffolding repair (adds gradle wrapper jar, icons, .metadata).
      - name: Repair platform scaffolding
        run: flutter create . --platforms android --org dev.globeorflat

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: flutter test
        run: flutter test

  build:
    name: build release APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release upload on v* tags
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair platform scaffolding
        run: flutter create . --platforms android --org dev.globeorflat

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk (release)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             /tmp/globeorflat-${{ github.sha }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: globeorflat-release-apk
          path: /tmp/globeorflat-${{ github.sha }}.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/globeorflat-${{ github.sha }}.apk
          generate_release_notes: true
